[package]
name = "cod-native-wgpu-lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
bytemuck = "1.25"
clap = { version = "4.5", features = ["derive"] }
cpu-time = "1.0"
glam = "0.30"
png = "0.18"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
wgpu = { version = "30.0.1", default-features = false, features = [
  "std",
  "parking_lot",
  "vulkan",
  "wgsl",
] }
winit = "0.30.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
