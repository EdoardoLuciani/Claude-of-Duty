name: Validate

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: bun run format:check
      - run: bun run build:ci # prebuild runs typecheck and lint; skips Blender assets
      - run: bun run test
