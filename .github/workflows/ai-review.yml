name: AI Review

# Pipeline controller:
#   - triggered when the deterministic CI workflow (Validate) completes
#   - verifies PR provenance (base==develop, head=agent/*, same repo, labels,
#     owner-authorized originating issue) BEFORE touching anything sensitive
#   - if CI passed  -> runs the independent reviewer (kimi-k3 via OpenRouter,
#     reasoning effort high) with READ-ONLY tools and NO project code execution
#   - if CI failed  -> deterministically requests a fix round (ai-fix-needed)
#   - publishes review/CI results and manages labels in a separate job that has
#     NO model credentials
#
# Security (spec sections 16/17/18/27):
#   - OPENROUTER_API_KEY exists ONLY on the single `review` step of the
#     `review` job. The `publish` job (which can write to GitHub) has no model
#     credentials, and the review job has no write permissions.
#   - The review job never runs project code: no npm/pip project installs, no
#     project scripts; the reviewer CLI is installed globally and runs with
#     tools allowlisted to read/glob/grep only.
#   - The agent branch is checked out ONLY after provenance passes.

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number to review manually"
        required: false
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: ai-review-${{ github.event.workflow_run.head_branch || github.ref_name }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REVIEW_SCRIPT: .github/scripts/ai-review/review.py

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout workflow tooling (default branch, trusted)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Disable git hooks (defense in depth)
        run: git config --global core.hooksPath /dev/null

      - name: Resolve PR and verify provenance
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_FLAG=""
          if [ -n "${{ inputs.pr-number }}" ]; then PR_FLAG="--pr-number ${{ inputs.pr-number }}"; fi
          python3 "$REVIEW_SCRIPT" resolve \
            --run-id "${{ github.event.workflow_run.id || '' }}" \
            --head-sha "${{ github.event.workflow_run.head_sha || github.sha }}" \
            $PR_FLAG \
            --out "$RUNNER_TEMP/state.json"
          ACTION=$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/state.json"))["action"])')
          HEAD_REF=$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/state.json"))["head_ref"] or "")')
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

      - name: Skip — not an eligible autonomous PR
        if: steps.resolve.outputs.action == 'skip'
        run: |
          python3 -c 'import json; s=json.load(open("'"$RUNNER_TEMP"'/state.json")); print("SKIP:", s["reason"])'

      - name: Prepare CI-failure fix request
        if: steps.resolve.outputs.action == 'ci-fix'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq '{failed_jobs, run_url: .ci_run_url, head_sha}' \
            < "$RUNNER_TEMP/state.json" > "$RUNNER_TEMP/ci-fix.json"
          echo "ci-fix request prepared: $(jq -c .failed_jobs "$RUNNER_TEMP/ci-fix.json")"

      - name: Render review prompt (PR context from state)
        if: steps.resolve.outputs.action == 'review'
        run: |
          PR_NUMBER=$(jq -r .pr_number "$RUNNER_TEMP/state.json")
          HEAD_SHA=$(jq -r .head_sha "$RUNNER_TEMP/state.json")
          sed -e "s/{{PR_NUMBER}}/$PR_NUMBER/g" \
              -e "s/{{HEAD_SHA}}/$HEAD_SHA/g" \
              -e "s/{{REPO}}/$GITHUB_REPOSITORY/g" \
              .github/scripts/ai-review/review-prompt.md > "$RUNNER_TEMP/review-prompt.md"

      - name: Checkout agent branch for reading (provenance verified above)
        if: steps.resolve.outputs.action == 'review'
        uses: actions/checkout@v4
        with:
          ref: refs/heads/${{ steps.resolve.outputs.head_ref }}
          path: pr-checkout
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned pi CLI (global tooling — NOT project code)
        if: steps.resolve.outputs.action == 'review'
        run: npm install --ignore-scripts -g @earendil-works/pi-coding-agent@0.84.1
      - name: Run independent reviewer (kimi-k3, reasoning high, READ-ONLY)
        if: steps.resolve.outputs.action == 'review'
        timeout-minutes: 25
        env:
          # The ONLY step in this repository that has model credentials.
          # Scoped to this single step; no other step or job can see it.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Read-only GITHUB_TOKEN, used only by the gh_* extension tools.
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEW_TOOL_LOG: ${{ runner.temp }}/review-tool-calls.log
        run: |
          set -o pipefail
          # NODE_PATH lets the gh-readonly extension (repo file, outside pi's
          # package tree) resolve its typebox dependency from the global install.
          export NODE_PATH="$(npm root -g)"
          cd "${GITHUB_WORKSPACE}/pr-checkout"
          pi -p --no-session --no-skills --no-extensions --no-context-files \
            -e "${GITHUB_WORKSPACE}/.github/extensions/gh-readonly.cjs" \
            -t read,glob,grep,gh_pr_view,gh_pr_diff,gh_issue_view,gh_check_runs \
            --model openrouter/moonshotai/kimi-k3 \
            --thinking high \
            @"$RUNNER_TEMP/review-prompt.md" > "$RUNNER_TEMP/review-raw.txt" 2> "$RUNNER_TEMP/review-err.txt" || {
              echo "::error::reviewer run failed (exit $?) — see review-err.txt"
              exit 1
            }
          export -n OPENROUTER_API_KEY GH_TOKEN
          echo "reviewer output bytes: $(wc -c < "$RUNNER_TEMP/review-raw.txt")"

      - name: Validate structured review output (fail closed)
        if: steps.resolve.outputs.action == 'review'
        run: |
          python3 "$REVIEW_SCRIPT" parse \
            --raw "$RUNNER_TEMP/review-raw.txt" \
            --state "$RUNNER_TEMP/state.json" \
            --out "$RUNNER_TEMP/review.json"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.event.workflow_run.id || github.run_id }}
          path: |
            ${{ runner.temp }}/state.json
            ${{ runner.temp }}/review.json
            ${{ runner.temp }}/review-raw.txt
            ${{ runner.temp }}/review-prompt.md
            ${{ runner.temp }}/review-tool-calls.log
            ${{ runner.temp }}/ci-fix.json
          if-no-files-found: warn

  publish:
    needs: review
    if: always() && needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download review artifacts
        uses: actions/download-artifact@v4
        with:
          name: ai-review-${{ github.event.workflow_run.id || github.run_id }}
          path: ${{ runner.temp }}

      - name: Publish review result and manage labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -f "$RUNNER_TEMP/review.json" ]; then
            python3 "$REVIEW_SCRIPT" publish \
              --state "$RUNNER_TEMP/state.json" \
              --review "$RUNNER_TEMP/review.json"
          elif [ -f "$RUNNER_TEMP/ci-fix.json" ]; then
            python3 "$REVIEW_SCRIPT" publish \
              --state "$RUNNER_TEMP/state.json" \
              --ci-fix "$RUNNER_TEMP/ci-fix.json"
          else
            echo "no publish payload — skipping"
          fi
