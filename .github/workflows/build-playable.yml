name: Build playable artifact

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'push' && 'github-pages' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BLENDER_VERSION: '5.3.0'
      GLTFPACK_VERSION: '1.3'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version-file: package.json
      - run: bun ci
      - name: Cache asset toolchain
        uses: actions/cache@v6
        id: toolchain
        with:
          path: ${{ runner.temp }}/asset-tools
          key: asset-tools-v1-ubuntu24-${{ runner.arch }}-blender${{ env.BLENDER_VERSION }}-gltfpack${{ env.GLTFPACK_VERSION }}
      - name: Install Blender and gltfpack
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          blender_archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          blender_path="release/Blender${BLENDER_VERSION%.*}/$blender_archive"
          echo "Downloading Blender from download.blender.org"
          if ! curl -fsSL --retry 3 -o "$blender_archive" "https://download.blender.org/$blender_path"; then
            echo "Retrying Blender from the Clarkson University mirror"
            curl -fsSL --retry 3 -o "$blender_archive" "https://mirror.clarkson.edu/blender/$blender_path"
          fi
          echo "Downloading gltfpack from GitHub Releases"
          curl -fsSL --retry 3 -o gltfpack-ubuntu.zip "https://github.com/zeux/meshoptimizer/releases/download/v${GLTFPACK_VERSION}/gltfpack-ubuntu.zip"
          printf '%s  %s\n' \
            dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05 "$blender_archive" \
            0666d9dc40d60fe5b9a45f3fc24f8e6ca87112974bd5de9ca57152aa13d06017 gltfpack-ubuntu.zip \
            | sha256sum --check
          mkdir -p asset-tools
          tar -xJf "$blender_archive" -C asset-tools
          unzip -q gltfpack-ubuntu.zip -d asset-tools
      - name: Set asset tool paths
        run: |
          printf '%s\n' "$RUNNER_TEMP/asset-tools/blender-${BLENDER_VERSION}-linux-x64" \
            "$RUNNER_TEMP/asset-tools" >> "$GITHUB_PATH"
      - name: Cache generated assets
        uses: actions/cache@v6
        with:
          path: |
            .cache/assets/*.sha256
            .cache/blender
            public/models
            node_modules/.cache/claude-of-duty-models.hash
            node_modules/.cache/claude-of-duty-proc.hash
          # On input changes, restore the last bundle and let each generator invalidate stale outputs.
          key: assets-v1-ubuntu24-${{ runner.arch }}-blender${{ env.BLENDER_VERSION }}-gltfpack${{ env.GLTFPACK_VERSION }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('tools/**', 'src/**', 'build/models.ts', 'bun.lock') }}
          restore-keys: assets-v1-ubuntu24-${{ runner.arch }}-blender${{ env.BLENDER_VERSION }}-gltfpack${{ env.GLTFPACK_VERSION }}-bun${{ steps.bun.outputs.bun-version }}-
      - name: Build playable site
        run: |
          blender --version
          gltfpack -v
          time bun run build
          test -s dist/index.html
          test -s dist/models/world/level.json
          test -s dist/models/player/arms.glb
          test -s dist/basis/basis_transcoder.wasm
          du -sh dist
      - name: Upload playable artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: claude-of-duty-playable
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5
